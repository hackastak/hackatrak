name: Bug report
description: Report something that isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug. Please fill out the sections below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran and the output you saw.
      placeholder: |
        1. Run `hackatrak sync ...`
        2. See error ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `hackatrak version`.
      placeholder: hackatrak v0.1.0 (abc1234)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / architecture
      placeholder: macOS 15 (arm64)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any error output. This will be formatted as code.
      render: shell
